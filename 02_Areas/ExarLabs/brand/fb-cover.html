<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<!-- ExarLabs Facebook page cover — hero-echo of exarlabs.com
     Committed navy + warm clay. Bricolage Grotesque + Hanken Grotesk. OKLCH.
     Canvas 1640x624 (2x of FB desktop 820x312). Critical content kept inside
     the central safe band so neither the desktop nor the mobile (640x360) crop
     touches it. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900: oklch(0.20 0.05 256);
    --navy-800: oklch(0.26 0.07 256);
    --navy-700: oklch(0.32 0.09 256);
    --navy-600: oklch(0.40 0.10 256);
    --clay-500: oklch(0.71 0.135 56);
    --clay-400: oklch(0.80 0.115 60);
    --on-navy:       oklch(0.97 0.01 250);
    --on-navy-muted: oklch(0.84 0.035 256);
    --font-display: "Bricolage Grotesque", Georgia, serif;
    --font-body: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1640px; height:624px; }
  .cover{
    position:relative; width:1640px; height:624px; overflow:hidden;
    /* depth: deep navy field, lit from upper-left toward navy-700, like the site hero */
    background:
      radial-gradient(120% 150% at 18% 8%, var(--navy-700) 0%, var(--navy-800) 46%, var(--navy-900) 100%);
    font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center;
  }
  /* faint clay glow, low presence, anchors the warm accent without glassmorphism */
  .cover::before{
    content:""; position:absolute; right:-8%; bottom:-30%;
    width:760px; height:760px; border-radius:50%;
    background: radial-gradient(circle, oklch(0.71 0.135 56 / 0.16) 0%, transparent 62%);
    pointer-events:none;
  }
  /* whisper-quiet ruled grid, architectural nod, sits under everything */
  .cover::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(to right, oklch(0.97 0.01 250 / 0.028) 1px, transparent 1px);
    background-size:118px 100%;
    mask-image: linear-gradient(to right, transparent, #000 22%, #000 78%, transparent);
  }

  .stage{
    position:relative; z-index:2;
    width:1180px;            /* central safe band, survives the 640/820 mobile crop */
    text-align:center;
    display:flex; flex-direction:column; align-items:center;
  }

  /* brand signature row: clay mark + wordmark + place label */
  .sig{
    display:flex; align-items:center; gap:18px;
    margin-bottom:34px;
  }
  .mark{
    width:22px; height:22px; border-radius:5px;
    background:var(--clay-500);
    box-shadow: 0 0 0 6px oklch(0.71 0.135 56 / 0.14);
  }
  .wordmark{
    font-family:var(--font-display); font-weight:700; font-size:34px;
    letter-spacing:-0.01em; color:var(--on-navy); line-height:1;
  }
  .wordmark b{ font-weight:700; }
  .divider{ width:1px; height:26px; background:oklch(0.97 0.01 250 / 0.22); }
  .place{
    font-family:var(--font-body); font-weight:600; font-size:18px;
    letter-spacing:0.2em; text-transform:uppercase;
    color:var(--on-navy-muted);
  }

  /* hero headline — the actual site H1 promise */
  .headline{
    font-family:var(--font-display); font-weight:600;
    font-size:68px; line-height:1.05; letter-spacing:-0.015em;
    color:var(--on-navy); max-width:24ch;
  }
  .headline .accent{
    position:relative; white-space:nowrap;
    color:var(--on-navy);
  }
  /* clay underline, echoing the site's clay link-underline pattern */
  .headline .accent::after{
    content:""; position:absolute; left:0; right:0; bottom:-0.12em;
    height:5px; border-radius:3px; background:var(--clay-500);
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="stage">
      <div class="sig">
        <span class="mark"></span>
        <span class="wordmark">ExarLabs</span>
        <span class="divider"></span>
        <span class="place">Székelyudvarhely</span>
      </div>
      <h1 class="headline">Digitális megoldásokat építünk<br>helyi <span class="accent">vállalkozásoknak</span>.</h1>
    </div>
  </div>
</body>
</html>
