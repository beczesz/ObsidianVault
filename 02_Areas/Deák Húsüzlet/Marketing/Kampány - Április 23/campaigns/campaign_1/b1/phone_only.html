<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Mockup — Transparent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    /* checkerboard so the user can SEE the transparency in browser; remove if exporting */
    background-image:
      linear-gradient(45deg, rgba(0,0,0,0.06) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(0,0,0,0.06) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.06) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.06) 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  }
  body.clean { background: transparent !important; }

  .stage {
    position: relative;
    padding: 80px;
  }

  .phone {
    width: 330px;
    height: 682px;
    border-radius: 32px;
    background: #222;
    padding: 6px;
    position: relative;
    box-shadow:
      0 24px 64px rgba(0,0,0,0.22),
      0 4px 12px rgba(0,0,0,0.10);
  }
  .notch {
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 18px;
    background: #222;
    border-radius: 0 0 12px 12px;
    z-index: 2;
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 26px;
    overflow: hidden;
    background: #FFFBF7;
  }
  .screen img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top;
    display: block;
  }

  .toggle {
    position: fixed; top: 16px; right: 16px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    background: rgba(0,0,0,0.75); color: white;
    padding: 8px 12px; border-radius: 8px;
    border: none; cursor: pointer;
    z-index: 10;
  }
  @media print {
    .toggle { display: none; }
    body { background: transparent !important; }
  }
</style>
</head>
<body>

<button class="toggle" onclick="document.body.classList.toggle('clean')">toggle checkerboard</button>

<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <img src="assets/phone-screen-real.png" alt="Phone screen">
    </div>
  </div>
</div>

</body>
</html>
