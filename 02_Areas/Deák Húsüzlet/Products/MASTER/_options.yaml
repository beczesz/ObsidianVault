# Deák Húsmíves — Option (VG = Variation Group) Master
#
# Egyetlen forrás az 5 opció-típushoz (DH-173). A termék MD-ek csak `option_ids`
# listával hivatkoznak ide, és per-termék override-okat adhatnak az
# `option_value_overrides` mezővel.
#
# A build.py merge-eli az itteni master-t a per-termék override-okkal és
# generálja a teljes products-vX.Y.json `options[]` array-t termékenként.
#
# Spec: Business Development/pilot-husuzlet/product-variations/vg-content-spec-v1.0.md
# Schema: _schema-v1.2.json
# Verzió: 1.0 (2026-05-09)

options:

  # ─────────────────────────────────────────────────────
  # 1. PÁCOLÁS / MARINARE — OPTIONAL, díjköteles (+2 RON/kg)
  # ─────────────────────────────────────────────────────
  - option_id: pacolas
    option_name_hu: Pácolva
    option_name_ro: Marinare
    option_type: single_select
    kind: optional
    default_value: null
    vg_off_hint_hu: Pácolatlan
    vg_off_hint_ro: Nemarinat
    display_order: 20
    values:
      - value_id: hagyomanyos
        value_label_hu: Hagyományos
        value_label_ro: Tradițional
        meta_hint_hu: "Só, bors, fokhagyma"
        meta_hint_ro: "Sare, piper, usturoi"
        image_url: null
        image_alt_hu: "Sózott-borsozott, fokhagymás karaj"
        image_alt_ro: "Cotlet sărat-piperat cu usturoi"
        description_hu: "Só, bors, fokhagyma, friss fűszerek. Klasszikus kárpát-medencei ízprofil sütésre és grillezésre. A mészáros 24 órás pácolást javasol, hogy az ízek mélyen átjárják a húst. Felár: +2 RON/kg."
        description_ro: "Sare, piper, usturoi, ierburi proaspete. Profil clasic carpatic pentru frigare și grătar. Măcelarul recomandă 24 de ore de marinare pentru ca aromele să pătrundă bine. Supliment: +2 RON/kg."
        price_modifier: 2
        price_modifier_unit: per_kg
      - value_id: barbecue
        value_label_hu: Barbecue
        value_label_ro: Barbecue
        meta_hint_hu: "Paradicsomos, BBQ-szerű"
        meta_hint_ro: "Cu roșii, stil BBQ"
        image_url: null
        image_alt_hu: "Paradicsomos BBQ pácban karaj grillen"
        image_alt_ro: "Cotlet în marinată BBQ cu roșii pe grătar"
        description_hu: "Paradicsomos, édeskés, füstös ízprofil. Grillezésre kifejezetten ajánlott. A pác benne van, közvetlenül a grillre helyezhető. Felár: +2 RON/kg."
        description_ro: "Profil cu roșii, dulce, afumat. Recomandat pentru grătar. Marinata este deja în carne, direct pe grătar. Supliment: +2 RON/kg."
        price_modifier: 2
        price_modifier_unit: per_kg

