<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Szállítási adatok — Deák Húsmíves</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root {
  --bg: #FFFBF7;
  --primary: #9B2335;
  --text: #2C2825;
  --text2: #5C544C;
  --text3: #8A8078;
  --border: #C5BCB3;
  --border-light: #E8E2DB;
  --card-bg: #FFFFFF;
  --red-star: #C4302B;
  --green: #2D7A4F;
  --green-bg: rgba(45, 122, 79, 0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #FAF8F5; font-family: Inter, system-ui, -apple-system, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; margin: 0; }
.page-wrapper { max-width: 512px; width: 100%; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; }

/* Header */
.header { height: 56px; background: #FFF; position: fixed; top: 0; left: 0; right: 0; width: 100%; z-index: 10;
  box-shadow: rgba(0,0,0,0.12) 0px 0px 1px 0px, rgba(0,0,0,0.15) 0px 0.5px 2px 0px, rgba(0,0,0,0.16) 0px 2px 3px 0px; }
.header-inner { max-width: 512px; width: 100%; margin: 0 auto; display: flex; align-items: center; height: 100%; padding: 0 16px; }
.back-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: none; background: none; cursor: pointer; color: var(--text2); flex-shrink: 0; }
.back-btn svg { width: 20px; height: 20px; }
.header h1 { font-size: 18px; font-weight: 600; color: var(--text); letter-spacing: 0.18px; flex: 1; text-align: center; }
.header-spacer { width: 40px; flex-shrink: 0; }

/* Main form */
.main { padding: 72px 16px 144px; display: flex; flex-direction: column; gap: 24px; }

/* Form group */
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-label { font-size: 14px; font-weight: 500; color: var(--text); letter-spacing: 0.28px; }
.form-label .required { color: var(--red-star); }
.form-input { height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); font-size: 14px; font-weight: 400; color: var(--text); padding: 12px 16px; font-family: inherit; outline: none; letter-spacing: 0.28px; width: 100%; }
.form-input::placeholder { color: #9CA3AF; font-weight: 400; }
.form-textarea { border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg); font-size: 14px; color: var(--text); padding: 12px 16px; font-family: inherit; outline: none; resize: none; height: 96px; width: 100%; letter-spacing: 0.28px; }
.form-textarea::placeholder { color: #9CA3AF; }

/* Address section (gap-2.5 = 10px) */
.address-section { display: flex; flex-direction: column; gap: 10px; }
.section-header { font-size: 12px; font-weight: 700; color: var(--text3); letter-spacing: 0.6px; text-transform: uppercase; }

/* Address card (selected) */
.address-card { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 16px; border: 2px solid var(--primary); background: rgba(155,35,53,0.05); cursor: pointer; }

/* Radio button */
.radio-outer { width: 22px; height: 22px; border-radius: 9999px; border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
.radio-inner { width: 12px; height: 12px; border-radius: 9999px; background: var(--primary); }

/* Card content */
.card-content { flex: 1; min-width: 0; }
.card-title-row { display: flex; gap: 8px; align-items: center; margin-bottom: 2px; }
.card-title { font-size: 16px; font-weight: 600; color: var(--text); }
.card-badge { font-size: 10px; font-weight: 700; color: var(--green); background: var(--green-bg); padding: 2px 8px; border-radius: 9999px; }
.card-address { font-size: 13px; font-weight: 400; color: var(--text2); letter-spacing: 0.26px; line-height: normal; }

/* "Más címre kérem" button */
.add-address-btn { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; border: 2px dashed var(--border-light); background: var(--card-bg); cursor: pointer; height: 68px; }
.add-address-btn svg { width: 18px; height: 18px; color: var(--primary); flex-shrink: 0; }
.add-address-btn span { font-size: 16px; font-weight: 400; color: var(--text); }

/* Info box */
.info-box { display: flex; align-items: flex-start; gap: 8px; padding: 12px; background: rgba(155,35,53,0.05); border: 1px solid rgba(155,35,53,0.2); border-radius: 12px; margin-top: -16px; }
.info-box svg { width: 16px; height: 16px; color: var(--primary); flex-shrink: 0; margin-top: 2px; }
.info-box p { font-size: 13px; font-weight: 400; color: var(--text2); letter-spacing: 0.26px; line-height: normal; }

/* Date section */
.date-section { display: flex; flex-direction: column; gap: 4px; }
.date-scroll-wrapper { display: flex; align-items: center; gap: 4px; }
.date-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 8px 0; flex: 1; scrollbar-width: none; -ms-overflow-style: none; }
.date-scroll::-webkit-scrollbar { display: none; }
.date-btn { width: 80px; height: 64px; border-radius: 16px; border: 1px solid var(--border); background: var(--card-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; flex-shrink: 0; padding: 0; }
.date-btn .day-name { font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: 0.26px; }
.date-btn .day-date { font-size: 14px; font-weight: 500; color: var(--text); letter-spacing: 0.28px; }
.date-btn.selected { border-color: var(--primary); background: rgba(155,35,53,0.05); }
.date-btn.selected .day-name,
.date-btn.selected .day-date { color: var(--primary); }
.scroll-arrow { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: none; background: none; cursor: pointer; color: var(--text3); flex-shrink: 0; }
.scroll-arrow svg { width: 16px; height: 16px; }

/* Scrollbar track */
.scrollbar-track { height: 4px; background: var(--border-light); border-radius: 2px; position: relative; }
.scrollbar-thumb { height: 100%; width: 40%; background: var(--text3); border-radius: 2px; }

/* Date hint */
.date-hint-section { display: flex; flex-direction: column; gap: 8px; }
.date-hint { font-size: 13px; font-weight: 400; color: var(--text3); letter-spacing: 0.26px; }

/* Counter */
.char-counter { font-size: 12px; font-weight: 400; color: var(--text3); letter-spacing: 0.24px; text-align: right; }

/* Optional label */
.optional-label { font-size: 13px; font-weight: 400; color: var(--text3); letter-spacing: 0.26px; }

/* CTA bar */
.cta-bar { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; z-index: 15; background: rgba(255,255,255,0.95); box-shadow: rgba(0,0,0,0.1) 0px -1px 3px 0px; padding: 16px; height: 88px; }
.cta-bar-inner { max-width: 512px; width: 100%; margin: 0 auto; height: 56px; }
.cta-btn { display: block; width: 100%; height: 56px; padding: 0 8px; background: var(--primary); color: white; font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.28px; border: none; border-radius: 16px; cursor: pointer; text-align: center; }

.static-label { position: fixed; top: 8px; right: 8px; background: rgba(0,0,0,0.5); color: white; font-size: 9px; padding: 2px 6px; border-radius: 4px; z-index: 100; font-family: monospace; }
</style>
</head>
<body>
<div class="static-label">STATIC COPY — deakhus.ro</div>

<div class="page-wrapper">

<!-- Header -->
<div class="header">
  <div class="header-inner">
    <button class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1>Szállítási adatok</h1>
    <div class="header-spacer"></div>
  </div>
</div>

<!-- Main content -->
<div class="main">

  <!-- Címzett neve (pre-filled) -->
  <div class="form-group">
    <label class="form-label">Címzett neve <span class="required">*</span></label>
    <input class="form-input" type="text" value="Szabolcs Becze">
  </div>

  <!-- Telefonszám (pre-filled) -->
  <div class="form-group">
    <label class="form-label">Telefonszám <span class="required">*</span></label>
    <input class="form-input" type="text" value="0740 507 135">
  </div>

  <!-- SZÁLLÍTÁSI CÍM section (gap-2.5 = 10px) -->
  <div class="address-section">
    <p class="section-header">Szállítási cím</p>

    <!-- Address card (selected) -->
    <div class="address-card">
      <span class="radio-outer">
        <span class="radio-inner"></span>
      </span>
      <div class="card-content">
        <div class="card-title-row">
          <span class="card-title">Otthon</span>
          <span class="card-badge">Alapértelmezett</span>
        </div>
        <p class="card-address">Morii -</p>
        <p class="card-address">20</p>
        <p class="card-address">Székelyudvarhely, 535600</p>
      </div>
    </div>

    <!-- Más címre kérem -->
    <button class="add-address-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Más címre kérem</span>
    </button>
  </div>

  <!-- Info box (-mt-16px) -->
  <div class="info-box">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <p>Kiszállítás csak Székelyudvarhely és +10 km-es körzetében. 10 km-en túli kiszállítás esetén 1,5 RON/km pótdíj kerül felszámításra.</p>
  </div>

  <!-- Szállítási nap -->
  <div class="date-section">
    <label class="form-label">Szállítási nap <span class="required">*</span></label>
    <div class="date-scroll-wrapper">
      <button class="scroll-arrow">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="date-scroll">
        <button class="date-btn">
          <span class="day-name">Sze</span>
          <span class="day-date">6 máj.</span>
        </button>
        <button class="date-btn">
          <span class="day-name">Csüt</span>
          <span class="day-date">7 máj.</span>
        </button>
        <button class="date-btn">
          <span class="day-name">Pén</span>
          <span class="day-date">8 máj.</span>
        </button>
        <button class="date-btn">
          <span class="day-name">Szo</span>
          <span class="day-date">9 máj.</span>
        </button>
        <button class="date-btn">
          <span class="day-name">Hét</span>
          <span class="day-date">11 máj.</span>
        </button>
      </div>
      <button class="scroll-arrow">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="scrollbar-track"><div class="scrollbar-thumb"></div></div>
  </div>

  <!-- Date hint -->
  <div class="date-hint-section">
    <p class="date-hint">Először válasszon szállítási napot</p>
  </div>

  <!-- Megjegyzés -->
  <div class="form-group">
    <label class="form-label">Megjegyzés a szállításhoz <span class="optional-label">(opcionális)</span></label>
    <textarea class="form-textarea" placeholder="Pl: Csöngessen kétszer"></textarea>
    <p class="char-counter">0/200</p>
  </div>

</div>

</div><!-- /.page-wrapper -->

<!-- CTA bar -->
<div class="cta-bar">
  <div class="cta-bar-inner">
    <button class="cta-btn">Tovább</button>
  </div>
</div>

</body>
</html>
