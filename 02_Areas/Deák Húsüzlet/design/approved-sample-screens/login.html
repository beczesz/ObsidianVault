<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Deák Húsmíves</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #FAF8F5;
    --card-bg: #FFFFFF;
    --card-border: #E8E2DB;
    --input-border: #C5BCB3;
    --primary: #9B2335;
    --primary-hover: #872030;
    --text: #2C2825;
    --text2: #5C544C;
    --text3: #8A8078;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* Page layout */
  .dhop-auth-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
    position: relative;
  }

  /* Back link */
  .dhop-auth-back {
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
  }
  .dhop-auth-back:hover { color: var(--text); }
  .dhop-auth-back svg { width: 16px; height: 16px; }

  /* Title */
  .dhop-auth-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
    margin: 64px 0 24px;
  }

  /* Card */
  .dhop-auth-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 448px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  .dhop-card-body {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Social buttons */
  .dhop-social-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .dhop-social-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    height: 50px;
    padding: 12px 16px;
    background: #FFFFFF;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .dhop-social-btn:hover {
    border-color: var(--text3);
    background: #FAFAFA;
  }
  .dhop-social-btn img {
    width: 20px;
    height: 20px;
  }

  /* Divider */
  .dhop-divider {
    display: flex;
    align-items: center;
    gap: 16px;
    color: var(--text3);
    font-size: 14px;
  }
  .dhop-divider::before,
  .dhop-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }

  /* Input */
  .dhop-input-group { width: 100%; }

  .dhop-input {
    width: 100%;
    height: 50px;
    padding: 12px 16px;
    background: #FFFFFF;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    font-size: 16px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .dhop-input::placeholder { color: var(--text3); }
  .dhop-input:focus { border-color: var(--primary); }

  /* Primary button */
  .dhop-card-cta { margin-top: 8px; }

  .dhop-btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 48px;
    padding: 0 24px;
    background: var(--primary);
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .dhop-btn-primary:hover { background: var(--primary-hover); }

  /* Below card */
  .dhop-below-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    margin-top: 24px;
  }

  /* Language toggle */
  .dhop-lang-toggle {
    display: flex;
    gap: 8px;
  }

  .dhop-lang-btn {
    padding: 6px 12px;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    background: transparent;
    color: var(--text3);
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.15s;
  }
  .dhop-lang-btn:hover { border-color: var(--text3); }
  .dhop-lang-btn.active {
    background: var(--text);
    color: #FFFFFF;
    border-color: var(--text);
    font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <div class="dhop-auth-page">

    <a class="dhop-auth-back" href="#">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Termékek
    </a>

    <h1 class="dhop-auth-title">Bejelentkezés</h1>

    <div class="dhop-auth-card">
      <div class="dhop-card-body">

        <div class="dhop-social-buttons">
          <a class="dhop-social-btn" href="#">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Folytatás a Facebook fiókkal
          </a>
          <a class="dhop-social-btn" href="#">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Folytatás a Google fiókkal
          </a>
        </div>

        <div class="dhop-divider">vagy</div>

        <div class="dhop-input-group">
          <input class="dhop-input" type="email" placeholder="Email cím">
        </div>

        <div class="dhop-card-cta">
          <button class="dhop-btn-primary" type="button">Folytatás email-lel</button>
        </div>

      </div>
    </div>

    <div class="dhop-below-card">
      <div class="dhop-lang-toggle">
        <button class="dhop-lang-btn" type="button">RO</button>
        <button class="dhop-lang-btn active" type="button">HU</button>
      </div>
    </div>

  </div>
</main>
</body>
</html>
