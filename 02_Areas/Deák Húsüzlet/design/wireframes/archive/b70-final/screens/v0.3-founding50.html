const FEATURES = [
  { id: 'optA', label: 'DH-153 · Kampány modal', scenarios: [
    { id: 'a-bar',    label: 'Standard (37/50)' },
    { id: 'a-scarce', label: 'Szinte betelt (48/50)' },

  { id: 'flow', label: 'Megjelenési logika', scenarios: [
    { id: 'f-appear', label: 'Trigger flow' },
  ]},
  { id: 'grat', label: 'DH-154 · Gratuláció + Badge', scenarios: [
    { id: 'g-modal',   label: 'Gratuláció modal' },
    { id: 'g-profile', label: 'Badge — Profil' },
    { id: 'g-checkout',label: 'Badge — Checkout' },
    { id: 'g-order',   label: 'Badge — Rendelés' },
  ]},
];

let activeFeature = FEATURES[0].id;
let activeScenarios = {};
FEATURES.forEach(f => { activeScenarios[f.id] = f.scenarios[0].id; });

function renderTabs() {
  document.getElementById('tabs').innerHTML = FEATURES.map(f =>
    `<button class="tab ${f.id === activeFeature ? 'active' : ''}" onclick="switchFeature('${f.id}')">${f.label}</button>`
  ).join('');
}

function switchFeature(id) {
  activeFeature = id;
  renderTabs();
  renderContent();
}

function switchScenario(featureId, scenarioId) {
  activeScenarios[featureId] = scenarioId;
  renderContent();
}

function counterBar(taken, total) {
  const pct = Math.round((taken / total) * 100);
  const remaining = total - taken;
  return `
    <div class="counter-wrap">
      <div class="counter-bar">
        <div class="bar-label">
          <span class="bar-number">${taken}<span style="font-size:14px;font-weight:500;color:var(--text2)"> / ${total}</span></span>
          <span class="bar-total">hely betelve</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-hint">${remaining <= 5 ? `Már csak <b>${remaining} hely</b> maradt` : `Még ${remaining} hely elérhető`}</div>
      </div>
    </div>`;
}

function flowStep(num, title, desc, bg, color) {
  return `
    <div style="display:flex;align-items:center;gap:12px;background:${bg};border-radius:10px;padding:12px 16px">
      <span style="width:28px;height:28px;border-radius:50%;background:${color};color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${num}</span>
      <div>
        <div style="font-size:13px;font-weight:700;color:${color}">${title}</div>
        <div style="font-size:12px;color:#3A3028;margin-top:2px">${desc}</div>
      </div>
    </div>`;
}

function flowArrow() {
  return `<div style="text-align:center;padding:4px 0;color:var(--text2);font-size:16px">↓</div>`;
}

/* ────────────────────────────────────────
   Breadcrumb
   ──────────────────────────────────────── */
function updateBreadcrumb() {
  const f = FEATURES.find(x => x.id === activeFeature);
  const sc = activeScenarios[f.id];
  const s = f.scenarios.find(x => x.id === sc);
  const filename = location.pathname.split('/').pop();
  const ref = `@screen[${filename} > ${f.label} > ${s.label}]`;
  const bcText = document.getElementById('bcText');
  if (bcText) bcText.textContent = ref;
}

function copyBreadcrumb() {
  const text = document.getElementById('bcText').textContent;
  const bcCopy = document.getElementById('bcCopy');
  // Use fallback for iframe context
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  bcCopy.classList.add('copied');
  bcCopy.textContent = '✓';
  setTimeout(() => { bcCopy.classList.remove('copied'); bcCopy.textContent = '📋'; }, 1500);
}

// Init
renderTabs();
renderContent();

  var sy = 0, on = false, T = 64;
  document.addEventListener('touchstart', function(e){ if(window.scrollY===0){ sy=e.touches[0].clientY; on=true; } }, {passive:true});
  document.addEventListener('touchmove',  function(e){ if(!on) return; if(e.touches[0].clientY - sy > 10) el.classList.add('vis'); }, {passive:true});
  document.addEventListener('touchend',   function(e){ if(!on) return; var dy=(e.changedTouches[0]||{clientY:sy}).clientY - sy; if(dy >= T){ el.classList.add('spin'); setTimeout(function(){ location.reload(); }, 300); } else { el.classList.remove('vis'); } on=false; }, {passive:true});
})();
</script>
</body>
</html>
