    :root {
      --bg: #FFFDF4;
      --card-bg: #FFFFFF;
      --accent: #F4A832;
      --accent2: #4ABFA3;
      --accent3: #E05C5C;
      --text: #2B2B2B;
      --muted: #777;
      --radius: 18px;
      --shadow: 0 4px 16px rgba(0,0,0,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lexend', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 60px 0;
    }

    header {
      background: var(--accent);
      padding: 28px 24px 20px;
      text-align: center;
      border-bottom: 4px solid #e09220;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    header p {
      font-size: 1.1rem;
      color: #fff;
      margin-top: 6px;
      opacity: 0.92;
    }

    .font-toggle {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px 0;
      flex-wrap: wrap;
    }

    .font-toggle button {
      padding: 8px 20px;
      border: 2px solid var(--accent);
      border-radius: 40px;
      background: white;
      font-family: 'Lexend', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s;
    }

    .font-toggle button.active,
    .font-toggle button:hover {
      background: var(--accent);
      color: white;
    }

    .size-control {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 12px 24px 0;
    }

    .size-control span {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .size-control button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--accent2);
      background: white;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--accent2);
      line-height: 1;
      transition: all 0.2s;
    }

    .size-control button:hover {
      background: var(--accent2);
      color: white;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 20px 24px 8px;
      justify-content: center;
    }

    nav button {
      padding: 10px 18px;
      border-radius: 40px;
      border: 2px solid #ddd;
      background: white;
      font-family: 'Lexend', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text);
    }

    nav button.active,
    nav button:hover {
      background: var(--accent2);
      border-color: var(--accent2);
      color: white;
    }

    .chapter-title {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      padding: 24px 24px 8px;
      color: var(--text);
    }

    .chapter-subtitle {
      text-align: center;
      font-size: 1.1rem;
      color: var(--muted);
      padding-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
      padding: 0 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 18px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(244,168,50,0.2);
    }

    .card.flipped {
      border-color: var(--accent2);
      background: #f0faf7;
    }

    .card-emoji {
      font-size: 2.8rem;
      margin-bottom: 10px;
      line-height: 1;
    }

    .card-hu {
      font-size: var(--word-size, 1.35rem);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-en {
      font-size: var(--word-size, 1.35rem);
      font-weight: 700;
      color: var(--accent2);
      background: #e8f8f4;
      border-radius: 10px;
      padding: 4px 12px;
      margin-top: 4px;
      line-height: 1.3;
    }

    .card-phonetic {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 6px;
      font-style: italic;
    }

    .play-btn {
      margin-top: 12px;
      background: var(--accent);
      border: none;
      border-radius: 40px;
      color: white;
      padding: 7px 18px;
      font-family: 'Lexend', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .play-btn:hover {
      background: #e09220;
    }

    .chapter-btn-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 28px 24px 0;
    }

    .chapter-btn-row button {
      padding: 12px 28px;
      border-radius: 40px;
      border: none;
      font-family: 'Lexend', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-prev {
      background: #eee;
      color: var(--text);
    }

    .btn-next {
      background: var(--accent);
      color: white;
    }

    .btn-prev:hover { background: #ddd; }
    .btn-next:hover { background: #e09220; }

    .chapter-indicator {
      text-align: center;
      font-size: 0.95rem;
      color: var(--muted);
      padding-top: 8px;
    }

    @media (max-width: 500px) {
      header h1 { font-size: 1.5rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 0 12px; }
      .card { padding: 16px 10px 14px; }
    }
  </style>
</head>

function init() {
  buildNav();
  renderChapter(0);
}

function buildNav() {
  const nav = document.getElementById('chapNav');
  nav.innerHTML = '';
  chapters.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.textContent = ch.emoji + ' ' + ch.hu;
    btn.onclick = () => renderChapter(i);
    btn.id = 'navbtn-' + i;
    nav.appendChild(btn);
  });
}

function renderChapter(idx) {
  currentChapter = idx;
  const ch = chapters[idx];

  // Update nav
  document.querySelectorAll('#chapNav button').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });

  document.getElementById('chapTitle').textContent = ch.emoji + ' ' + ch.hu;
  document.getElementById('chapSubtitle').textContent = ch.en;
  document.getElementById('chapIndicator').textContent = (idx + 1) + ' / ' + chapters.length + ' fejezet';

  const grid = document.getElementById('wordGrid');
  grid.innerHTML = '';

  ch.words.forEach(w => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-emoji">${w.emoji}</div>
      <div class="card-hu">${w.hu}</div>
      <div class="card-en">${w.en}</div>
      <div class="card-phonetic">${w.ph}</div>
      <button class="play-btn" onclick="speakWord(event, '${w.en.split('/')[0].trim()}', '${w.hu}')">🔊 Kiejtés</button>
    `;
    grid.appendChild(card);
  });

  applyWordSize();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function speakWord(event, enWord, huWord) {
  event.stopPropagation();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(enWord);
    utt.lang = 'en-GB';
    utt.rate = 0.85;
    window.speechSynthesis.speak(utt);
  }
}

function nextChapter() {
  if (currentChapter < chapters.length - 1) renderChapter(currentChapter + 1);
}

function prevChapter() {
  if (currentChapter > 0) renderChapter(currentChapter - 1);
}

function applyWordSize() {
  const size = wordSizes[wordSizeLevel];
  document.querySelectorAll('.card-hu, .card-en').forEach(el => {
    el.style.fontSize = size;
  });
}

function setFont(font) {
  document.querySelectorAll('.font-toggle button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (font === 'lexend') {
    document.body.style.fontFamily = "'Lexend', sans-serif";
  } else if (font === 'arial') {
    document.body.style.fontFamily = "Arial, sans-serif";
  } else if (font === 'comic') {
    document.body.style.fontFamily = "'Comic Sans MS', cursive";
  }
  document.querySelectorAll('.card-hu, .card-en, .card-phonetic, nav button, .font-toggle button, .play-btn').forEach(el => {
    el.style.fontFamily = document.body.style.fontFamily;
  });
}

init();
</script>
