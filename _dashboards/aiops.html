<script>
/* ============================================================
   Minimal YAML frontmatter parser (shared pattern with the
   Sales / Partnerships dashboards). Supports scalars, inline +
   block arrays, block objects, and arrays of objects with
   nested arrays.
   ============================================================ */
function parseYamlFrontmatter(md) {
  const m = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (!m) return null;
  const lines = m[1].split('\n');
  const root = {};
  const stack = [{ indent: -1, container: root, key: null }];

  const stripComment = (line) => {
    let q = null;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === q && line[i-1] !== '\\') q = null; }
      else if (c === '"' || c === "'") q = c;
      else if (c === '#' && (i === 0 || /\s/.test(line[i-1]))) return line.slice(0, i).replace(/\s+$/, '');
    }
    return line.replace(/\s+$/, '');
  };
  const sv = (raw) => {
    let v = raw.trim();
    if (v === '') return '';
    if (v === 'null' || v === '~') return null;
    if (v === 'true') return true;
    if (v === 'false') return false;
    if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) return v.slice(1, -1);
    if (v.startsWith('[') && v.endsWith(']')) {
      const inner = v.slice(1, -1).trim();
      return inner ? inner.split(',').map(s => sv(s)) : [];
    }
    if (/^-?\d+$/.test(v)) return parseInt(v, 10);
    if (/^-?\d+\.\d+$/.test(v)) return parseFloat(v);
    return v;
  };

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (!raw || /^\s*$/.test(raw)) continue;
    const nc = stripComment(raw);
    if (!nc.trim()) continue;
    const indent = nc.match(/^(\s*)/)[1].length;
    const trimmed = nc.trim();
    while (stack.length > 1 && indent <= stack[stack.length-1].indent) stack.pop();
    const top = stack[stack.length-1];

    if (trimmed.startsWith('- ')) {
      const item = trimmed.slice(2).trim();
      if (!Array.isArray(top.container)) continue;
      const isQuotedScalar = item.startsWith('"') || item.startsWith("'");
      if (item.includes(':') && !isQuotedScalar) {
        const obj = {};
        top.container.push(obj);
        const ci = item.indexOf(':');
        const k = item.slice(0, ci).trim();
        const val = item.slice(ci+1).trim();
        if (val !== '') obj[k] = sv(val);
        stack.push({ indent, container: obj, key: null });
      } else {
        top.container.push(sv(item));
      }
      continue;
    }

    const ci = trimmed.indexOf(':');
    if (ci === -1) continue;
    const key = trimmed.slice(0, ci).trim();
    const val = trimmed.slice(ci+1).trim();
    const parent = top.container;
    if (val === '') {
      let ni = i + 1;
      while (ni < lines.length && /^\s*(#.*)?$/.test(lines[ni])) ni++;
      const nl = lines[ni] || '';
      const nIndent = nl.match(/^(\s*)/)[1].length;
      const nTrim = nl.trim();
      if (nTrim.startsWith('- ') && nIndent > indent) {
        const arr = []; if (Array.isArray(parent)) parent.push(arr); else parent[key] = arr;
        stack.push({ indent, container: arr, key });
      } else if (nIndent > indent && nTrim.includes(':')) {
        const obj = {}; if (Array.isArray(parent)) parent.push(obj); else parent[key] = obj;
        stack.push({ indent, container: obj, key });
      } else {
        if (Array.isArray(parent)) parent.push(null); else parent[key] = null;
      }
    } else {
      const value = sv(val);
      if (Array.isArray(parent)) parent.push({ [key]: value }); else parent[key] = value;
    }
  }
  return { frontmatter: root, body: md.slice(m[0].length) };
}

/* ============================================================
   State + helpers
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const OBSIDIAN_VAULT = 'ideas-vault';
const SOURCE_FILE = '/02_Areas/Sonrisa/CPS/Strategy/AI%20Ops/aiops.md';
const DASH_STEM = 'aiops';
let POLL_INTERVAL_MS = 8000;

let META = {};
let PILLARS = [];
let QUESTIONS = [];
let syncState = 'offline';
let lastMd = null;
let pollTimer = null;
let lastSyncAt = null;
let tickTimer = null;

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toSlug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
function copyText(text, el) {
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 1600);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    el.classList.add('copied');
    setTimeout(() => el.classList.remove('copied'), 1600);
  });
}
function wireCopyRef(container) {
  container.querySelectorAll('.card-copy-ref').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const card = btn.closest('[data-card-id]');
      if (!card) return;
      copyText(DASH_STEM + ':' + card.dataset.cardId, btn);
    };
  });
}
function obsidianOpen(filePath) {
  return `obsidian://open?vault=${encodeURIComponent(OBSIDIAN_VAULT)}&file=${encodeURIComponent(filePath)}`;
}
function basename(p) {
  const parts = String(p || '').split('/');
  return parts[parts.length - 1] || p;
}

/* ============================================================
   Render
   ============================================================ */
function statusLabel(s) {
  if (s === 'live') return 'Live';
  if (s === 'productized') return 'Productized';
  if (s === 'service') return 'Service';
  return 'Concept';
}

function renderMeta() {
  if (META.direction_name) {
    $('#dirName').innerHTML = escapeHtml(META.direction_name) + ' <span class="accent">.</span>';
    document.title = 'CPS · ' + META.direction_name;
  }
  $('#dirTagline').textContent = META.direction_tagline || '';
  $('#dirStatus').textContent = META.direction_status || 'forming';
  $('#beachhead').textContent = META.beachhead || '—';
  const live = PILLARS.filter(p => p.status === 'live').length;
  $('#pillarCount').textContent = PILLARS.length;
  $('#liveCount').textContent = live;
  const sl = $('#strategyLink');
  if (META.strategy_doc) { sl.href = obsidianOpen(META.strategy_doc); sl.style.display = ''; }
  else { sl.style.display = 'none'; }
}

function renderWidgets() {
  const total = PILLARS.length;
  const live = PILLARS.filter(p => p.status === 'live').length;
  const prod = PILLARS.filter(p => p.status === 'productized').length;
  const headline = PILLARS.find(p => p.status === 'productized') || PILLARS[0] || {};
  const headlineMetric = (headline.metrics && headline.metrics[0]) ? headline.metrics[0] : null;

  $('#widgets').innerHTML = `
    <div class="widget">
      <h2>Pillars</h2>
      <div class="big tabular">${total}</div>
      <div class="cap"><strong>${live}</strong> live · <strong>${prod}</strong> productized</div>
    </div>
    <div class="widget">
      <h2>Substrate</h2>
      <div class="big sm">${escapeHtml(METRIC_FOR('Inference Substrate', 'AWS spend') || 'In production')}</div>
      <div class="cap">private LLM runtime on AWS</div>
    </div>
    <div class="widget">
      <h2>Headline offer</h2>
      <div class="big sm">${escapeHtml(headline.name || '—')}</div>
      <div class="cap">${headlineMetric ? '<strong>' + escapeHtml(headlineMetric.value) + '</strong> ' + escapeHtml(headlineMetric.label) : 'the agentic layer'}</div>
    </div>
    <div class="widget">
      <h2>Open questions</h2>
      <div class="big tabular">${QUESTIONS.length}</div>
      <div class="cap">to resolve before scaling</div>
    </div>
  `;
}

function METRIC_FOR(pillarName, label) {
  const p = PILLARS.find(x => x.name === pillarName);
  if (!p || !Array.isArray(p.metrics)) return null;
  const m = p.metrics.find(x => x.label === label);
  return m ? m.value : null;
}

function renderPillars() {
  const wrap = $('#pillars');
  if (!PILLARS.length) {
    wrap.innerHTML = `<div class="empty-note">No pillar data. Check aiops.md.</div>`;
    return;
  }
  wrap.innerHTML = PILLARS.map(p => {
    const metrics = Array.isArray(p.metrics) ? p.metrics : [];
    const actions = Array.isArray(p.next_actions) ? p.next_actions : [];
    const sources = Array.isArray(p.source_files) ? p.source_files : [];

    const metricRows = metrics.map(m => `
      <div class="metric"><div class="label">${escapeHtml(m.label)}</div><div class="val">${escapeHtml(m.value)}</div></div>`).join('');
    const actionRows = actions.map(a => `<li>${escapeHtml(a)}</li>`).join('');
    const srcLinks = sources.map(s => `<a class="src-link" href="${obsidianOpen(s)}" title="${escapeAttr(s)}"><span>${escapeHtml(basename(s))}</span></a>`).join('');

    const cardId = toSlug(p.name || 'pillar');
    return `
      <article class="pillar" data-card-id="${escapeHtml(cardId)}" style="--pillar-accent: ${escapeAttr(p.accent || 'var(--accent)')}">
        <button class="card-copy-ref" aria-label="Kártya-azonosító másolása">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          copy ref
        </button>
        <div class="stripe"></div>
        <div class="body">
          ${p.layer ? `<div class="layer">${escapeHtml(p.layer)}</div>` : ''}
          <div class="head">
            <h3>${escapeHtml(p.name)}</h3>
            <span class="status-badge ${p.status || 'concept'}">${statusLabel(p.status)}</span>
          </div>
          ${p.maturity ? `<div class="maturity">${escapeHtml(p.maturity)}</div>` : ''}
          ${p.summary ? `<div class="summary">${escapeHtml(p.summary)}</div>` : ''}
          ${metricRows ? `<div class="metrics-row">${metricRows}</div>` : ''}
          ${actionRows ? `<div class="section-label">Next actions</div><ul class="actions-list">${actionRows}</ul>` : ''}
          ${srcLinks ? `<div class="sources">${srcLinks}</div>` : ''}
        </div>
      </article>`;
  }).join('');
}

function renderQuestions() {
  const sec = $('#questions');
  if (!QUESTIONS.length) { sec.hidden = true; return; }
  sec.hidden = false;
  $('#qCount').textContent = QUESTIONS.length;
  $('#qList').innerHTML = QUESTIONS.map(q => `<li>${escapeHtml(q)}</li>`).join('');
}

/* ============================================================
   Sync (read-only fetch, 8s poll)
   ============================================================ */
function syncLabel(state) {
  switch (state) {
    case 'live': {
      if (!lastSyncAt) return 'Live';
      const ago = Math.max(0, Math.floor((Date.now() - lastSyncAt) / 1000));
      if (ago < 2) return 'Live, just updated';
      const next = Math.max(0, Math.ceil(POLL_INTERVAL_MS/1000 - ago));
      return `Updated ${ago}s ago, next in ${next}s`;
    }
    case 'syncing': return 'Syncing';
    case 'error':   return 'Offline, click to retry';
    default:        return 'Connecting';
  }
}
function setSyncState(state, tooltip='') {
  syncState = state;
  const st = $('.sync-status');
  if (st) { st.dataset.state = state; st.title = tooltip; const l = $('.sync-label', st); if (l) l.textContent = syncLabel(state); }
}
function tickSyncLabel() {
  const st = $('.sync-status'); if (!st) return;
  const l = $('.sync-label', st); if (l) l.textContent = syncLabel(st.dataset.state || syncState);
}
function resetSyncBar() {
  const f = $('.sync-bar-fill'); if (!f) return;
  f.style.animation = 'none'; f.offsetHeight; f.style.animation = '';
}

async function pollVault({ silent=false } = {}) {
  if (!silent) setSyncState('syncing', 'Reading aiops.md...');
  try {
    const res = await fetch(SOURCE_FILE, { cache: 'no-store' });
    if (!res.ok) throw new Error(SOURCE_FILE + ' returned ' + res.status);
    const md = await res.text();
    if (md !== lastMd) {
      lastMd = md;
      const parsed = parseYamlFrontmatter(md);
      const fm = (parsed && parsed.frontmatter) ? parsed.frontmatter : {};
      META = fm;
      PILLARS = Array.isArray(fm.pillars) ? fm.pillars : [];
      QUESTIONS = Array.isArray(fm.open_questions) ? fm.open_questions : [];
      renderMeta();
      renderWidgets();
      renderPillars();
      renderQuestions();
      wireCopyRef(document);
    }
    lastSyncAt = Date.now();
    const ts = new Date().toLocaleTimeString();
    setSyncState('live', `Live, ${SOURCE_FILE}. ${PILLARS.length} pillars. Last check ${ts}. Polls every ${POLL_INTERVAL_MS/1000}s. Click to refresh now.`);
    resetSyncBar();
  } catch (e) {
    console.warn('Sync failed', e);
    setSyncState('error', `Cannot fetch ${SOURCE_FILE}. Serve over HTTP (npx serve . in vault root). ${e.message}`);
  }
}
function startPolling() { if (!pollTimer) pollTimer = setInterval(() => pollVault({ silent: true }), POLL_INTERVAL_MS); }
function startTicker() { if (!tickTimer) tickTimer = setInterval(tickSyncLabel, 1000); }

document.addEventListener('click', (e) => {
  if (e.target.closest('.sync-status')) pollVault({ silent: false });
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.classList?.contains('sync-status')) {
    e.preventDefault(); pollVault({ silent: false });
  }
});

/* ============================================================
   File-watcher push channel (SSE from dash-server.mjs).
   ============================================================ */
function connectEventStream() {
  if (typeof EventSource === 'undefined') return;
  let es;
  try { es = new EventSource('/__events'); } catch (e) { return; }
  const restartPolling = (ms) => {
    POLL_INTERVAL_MS = ms;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    startPolling();
  };
  es.addEventListener('open', () => restartPolling(30000));
  es.addEventListener('change', () => pollVault({ silent: true }));
  es.addEventListener('error', () => restartPolling(8000));
}

/* ============================================================
   Boot
   ============================================================ */
(async () => {
  await pollVault();
  startPolling();
  startTicker();
  connectEventStream();
})();

/* ===== Theme toggle (DS 0.3.0) ===== */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('dash-theme', t); } catch(e) {}
  const btn = document.getElementById('themeToggle');
  if (btn) {
    btn.querySelector('.theme-icon').textContent = t === 'dark' ? '☀' : '☾';
    btn.querySelector('.theme-label').textContent = t === 'dark' ? 'Light' : 'Dark';
    btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  }
}
document.getElementById('themeToggle').addEventListener('click', function() {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
window.addEventListener('storage', function(e) {
  if (e.key === 'dash-theme' && e.newValue) setTheme(e.newValue);
});
(function initTheme() {
  var t;
  try { t = localStorage.getItem('dash-theme'); } catch(e) {}
  if (!t) { t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
  setTheme(t);
})();
