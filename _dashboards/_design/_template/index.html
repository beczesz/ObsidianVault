/* ===== Masthead ===== */
.masthead { margin-bottom: 28px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }

.theme-toggle {

  transition: color var(--t-fast), border-color var(--t-fast), background var(--t-fast);
  cursor: pointer; user-select: none;
}

.theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 999px; }
.eyebrow {

  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.version-pill {

  background: var(--bg-elev); border: 1px solid var(--line); padding: 1px 7px;

<script>
// ============================================================
// PER-DASHBOARD CONFIG — edit these
// ============================================================
const DASH_STEM = 'template';                                   // == HTML filename without .html
const DATA_URL  = '/02_Areas/.../SOMETHING.md';                 // markdown source path

// ============================================================
// Data fetch + render
// ============================================================
async function fetchData() {
  const res = await fetch(DATA_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error('fetch failed: ' + res.status);
  return res.text();
}

function renderError(msg) {
  document.getElementById('content').innerHTML =
    `<div class="state error">Could not load data: ${escapeHtml(msg)}</div>`;
}

function renderEmpty() {
  document.getElementById('content').innerHTML =
    `<div class="state">No data yet. Edit ${escapeHtml(DATA_URL)} in Obsidian to populate.</div>`;
}

function renderCards(items) {
  const container = document.getElementById('content');
  if (!items || items.length === 0) { renderEmpty(); return; }
  container.innerHTML = `<div class="grid">${items.map((item) => {
    const id = toSlug(item.name || item.title || 'item');
    return `
      <article class="card" data-card-id="${escapeHtml(id)}">
        <button class="card-copy-ref" aria-label="Kártya-azonosító másolása" data-for-card>
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          copy ref
        </button>
        <h3>${escapeHtml(item.name || item.title || '(unnamed)')}</h3>
        <p>${escapeHtml(item.description || '')}</p>
      </article>
    `;
  }).join('')}</div>`;
  // Wire copy-ref buttons after dynamic render (clipboard.js exposes window.wireCopyRef)
  wireCopyRef(container);
}

async function refetchAndRender() {
  try {
    const md = await fetchData();
    const parsed = parseYamlFrontmatter(md);
    if (!parsed) { renderEmpty(); return; }
    // Adjust to your data shape — frontmatter may be a single object OR have an `items:` array
    const items = parsed.frontmatter.items || [];
    renderCards(items);
  } catch (e) {
    renderError(e.message);
  }
}

// ============================================================
// Boot — subscribe to LiveUpdates (SSE + poll fallback)
// ============================================================
LiveUpdates.subscribe(refetchAndRender);
LiveUpdates.mountStatusIndicator(document.querySelector('.masthead-toprow'));
refetchAndRender();
</script>
