<!--
  =============================================================================
  Presence Graph — Cross-org social media presence matrix.        Version: 0.2.3
  =============================================================================
  Shows all organizations managed by Szabolcs Becze and their channel presence
  across platforms (Facebook, Instagram, YouTube, TikTok, X, Spotify, Patreon).
  Reads from: /02_Areas/*/presence.md (schema: presto.org-presence.v1)
  Read-only. Edit presence.md files in Obsidian.

  Audit trail:
    0.2.3 (2026-05-29) tend: version-pill normalized family-wide. CSS: font-size 10.5px, padding 2px 8px, font-weight 500 (was 10px, 1px 7px, no weight). Markup: mono class added.
    0.2.2 (2026-05-28) promoted: Alfred Tasks Sidebar (DS 0.9.0). .app → .app-main + .app-shell layout. alfred-tasks.js added.
    0.2.1 (2026-05-25) — promote: panel-anchor system (DS 0.8.0). Section IDs renamed to
          panel-1-header-strip, panel-2-presence-matrix, panel-3-recovery-chains.
          scroll-margin-top: 42px. JS references updated.
    0.2.0 (2026-05-25) feature: clickable channel detail panel (inline expand).
    0.1.0 (2026-05-25) initial: presence matrix, summary strip, recovery chain.
  =============================================================================
-->

<style>

<script>
const DASH_STEM = 'presences';

const PLATFORMS = [
  { id: 'facebook', label: 'Facebook', abbr: 'FB' },
  { id: 'instagram', label: 'Instagram', abbr: 'IG' },
  { id: 'youtube', label: 'YouTube', abbr: 'YT' },
  { id: 'tiktok', label: 'TikTok', abbr: 'TT' },
  { id: 'x-twitter', label: 'X', abbr: 'X' },
  { id: 'spotify', label: 'Spotify', abbr: 'SP' },
  { id: 'patreon', label: 'Patreon', abbr: 'PA' },
];

const PRESENCE_SOURCES = [
  '/02_Areas/Szem%C3%A9lyes/presence.md',
  '/02_Areas/Navig%C3%A1tor%20Podcast/presence.md',
  '/02_Areas/F%C3%B3kuszpont/presence.md',
  '/02_Areas/ExarLabs/presence.md',
  '/02_Areas/Mikado/presence.md',
  '/02_Areas/Ignis/presence.md',
  '/02_Areas/M%C3%A9dia%20M%C5%B1hely/presence.md',
  '/02_Areas/Szem%C3%A9lyes/vezetok-imaja-presence.md',
];

let _presenceOrgs = [];
let _activeDetail = null;

function parseChannelsFromYaml(raw) {
  const channels = [];
  const yamlMatch = raw.match(/^---\n([\s\S]*?)\n---/);
  if (!yamlMatch) return channels;
  const yaml = yamlMatch[1];

  const channelBlocks = yaml.split(/\n\s+-\s+platform:\s*/);
  channelBlocks.shift();

  for (const block of channelBlocks) {
    const lines = block.split('\n');
    const ch = { platform: lines[0].trim().replace(/["']/g, '') };
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i];
      if (/^\s+-\s+platform:/.test(line)) break;
      const m = line.match(/^\s+(\w[\w_-]*):\s*(.+)/);
      if (m) {
        let val = m[2].trim().replace(/^["']|["']$/g, '');
        ch[m[1]] = val;
      }
    }
    channels.push(ch);
  }
  return channels;
}

function inferStatus(channel) {
  if (!channel.status) return 'unknown';
  const s = channel.status.toLowerCase();
  if (s === 'active') return 'active';
  if (s.includes('recovery')) return 'recovery';
  if (s === 'planned') return 'planned';
  if (s === 'unknown' || s === 'inactive') return 'unknown';
  return 'unknown';
}

async function fetchPresence(url) {
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return null;
    const raw = await res.text();
    const parsed = parseYamlFrontmatter(raw);
    if (!parsed) return null;
    const fm = parsed.frontmatter;
    const channels = parseChannelsFromYaml(raw);
    let platformsList = [];
    if (typeof fm.platforms === 'string') {
      platformsList = fm.platforms.replace(/[\[\]]/g, '').split(',').map(s => s.trim());
    } else if (Array.isArray(fm.platforms)) {
      platformsList = fm.platforms;
    }
    return {
      org_name: fm.org_name || fm.title || '(unnamed)',
      org_id: fm.org_id || toSlug(fm.org_name || ''),
      role: fm.role || 'admin',
      platforms: platformsList,
      channels: channels,
      source: url,
    };
  } catch (e) {
    return null;
  }
}

function getChannelForPlatform(org, platformId) {
  return org.channels.find(c => c.platform === platformId) || null;
}

function renderSummary(orgs) {
  const totalChannels = orgs.reduce((sum, o) => sum + o.channels.length, 0);
  const issues = orgs.reduce((sum, o) =>
    sum + o.channels.filter(c => inferStatus(c) === 'recovery').length, 0);
  const auditsNeeded = orgs.reduce((sum, o) =>
    sum + o.channels.filter(c => inferStatus(c) === 'unknown').length, 0);

  document.getElementById('panel-1-header-strip').innerHTML = `
    <div class="summary-stat">
      <div class="label">Organizations</div>
      <div class="value">${orgs.length}</div>
    </div>
    <div class="summary-stat">
      <div class="label">Active channels</div>
      <div class="value ok">${totalChannels}</div>
    </div>
    <div class="summary-stat">
      <div class="label">Recovery needed</div>
      <div class="value ${issues > 0 ? 'gap' : ''}">${issues}</div>
    </div>
    <div class="summary-stat">
      <div class="label">Audit pending</div>
      <div class="value ${auditsNeeded > 0 ? 'warn' : ''}">${auditsNeeded}</div>
    </div>
  `;
}

function renderMatrix(orgs) {
  closeChannelDetail();
  document.getElementById('org-count').textContent = orgs.length;

  const section = document.getElementById('panel-2-presence-matrix');
  const headerCells = PLATFORMS.map(p =>
    `<th>${escapeHtml(p.abbr)}<br><span style="font-size:9px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-4)">${escapeHtml(p.label)}</span></th>`
  ).join('');

  const rows = orgs.map(org => {
    const cells = PLATFORMS.map(p => {
      const ch = getChannelForPlatform(org, p.id);
      if (!ch) {
        const hasPlatform = org.platforms.includes(p.id);
        if (hasPlatform) {
          return `<td><span class="status-dot dot-unknown" data-tooltip="${escapeHtml(p.label)}: audit needed">?</span></td>`;
        }
        return `<td><span class="status-dot dot-empty">&middot;</span></td>`;
      }
      const status = inferStatus(ch);
      const name = ch.name || ch.handle || p.label;
      const tooltip = `${escapeHtml(name)} (${status})`;
      const icon = status === 'active' ? '&#10003;' : status === 'recovery' ? '!' : status === 'planned' ? '~' : '?';
      return `<td><span class="status-dot dot-${status}" data-tooltip="${tooltip}" data-org-id="${escapeHtml(org.org_id)}" data-platform="${escapeHtml(p.id)}" onclick="handleDotClick(this)">${icon}</span></td>`;
    }).join('');

    return `
      <tr data-card-id="org/${escapeHtml(org.org_id)}">
        <td>
          <span class="org-name">${escapeHtml(org.org_name)}</span>
          <span class="org-role">${escapeHtml(org.role)}</span>
          <button class="card-copy-ref" aria-label="Copy org ref" data-for-card onclick="event.stopPropagation()">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            copy ref
          </button>
        </td>
        ${cells}
      </tr>
    `;
  }).join('');

  section.innerHTML = `
    <div class="matrix-wrap">
      <table class="matrix">
        <thead>
          <tr>
            <th>Organization</th>
            ${headerCells}
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    </div>
  `;

  wireCopyRef(section);
}

function handleDotClick(dotEl) {
  const orgId = dotEl.getAttribute('data-org-id');
  const platform = dotEl.getAttribute('data-platform');
  if (!orgId || !platform) return;
  if (_activeDetail && _activeDetail.orgId === orgId && _activeDetail.platform === platform) {
    closeChannelDetail();
    return;
  }
  openChannelDetail(orgId, platform, dotEl);
}

function openChannelDetail(orgId, platformId, dotEl) {
  closeChannelDetail();
  const org = _presenceOrgs.find(o => o.org_id === orgId);
  if (!org) return;
  const ch = org.channels.find(c => c.platform === platformId);
  if (!ch) return;

  dotEl.classList.add('selected');
  const orgRow = dotEl.closest('tr');
  orgRow.classList.add('detail-open');

  const detailRow = document.createElement('tr');
  detailRow.className = 'detail-row';
  detailRow.innerHTML = `<td colspan="${PLATFORMS.length + 1}">${renderChannelDetail(org, ch)}</td>`;
  orgRow.after(detailRow);
  wireCopyRef(detailRow);

  _activeDetail = { orgId, platform: platformId, rowEl: detailRow, dotEl };
}

function closeChannelDetail() {
  if (!_activeDetail) return;
  _activeDetail.dotEl.classList.remove('selected');
  const orgRow = _activeDetail.rowEl.previousElementSibling;
  if (orgRow) orgRow.classList.remove('detail-open');
  _activeDetail.rowEl.remove();
  _activeDetail = null;
}

function renderChannelDetail(org, ch) {
  const status = inferStatus(ch);
  const fields = [];
  if (ch.name) fields.push({ label: 'Name', value: escapeHtml(ch.name) });
  if (ch.handle) fields.push({ label: 'Handle', value: `<span class="mono">${escapeHtml(ch.handle)}</span>` });
  if (ch.url) fields.push({ label: 'URL', value: `<a href="${escapeHtml(ch.url)}" target="_blank" rel="noopener">${escapeHtml(ch.url)}</a>` });
  if (ch.type) fields.push({ label: 'Type', value: escapeHtml(ch.type) });
  if (ch.email) fields.push({ label: 'Email', value: `<a href="mailto:${escapeHtml(ch.email)}">${escapeHtml(ch.email)}</a>` });
  if (ch.phone) fields.push({ label: 'Phone', value: `<a href="tel:${escapeHtml(ch.phone)}">${escapeHtml(ch.phone)}</a>` });
  if (ch.fallback_email) fields.push({ label: 'Fallback email', value: `<a href="mailto:${escapeHtml(ch.fallback_email)}">${escapeHtml(ch.fallback_email)}</a>` });
  if (ch.access_via) fields.push({ label: 'Access via', value: escapeHtml(ch.access_via) });
  if (ch.recovered) fields.push({ label: 'Recovered', value: escapeHtml(ch.recovered) });
  if (ch.notes) fields.push({ label: 'Notes', value: escapeHtml(ch.notes) });

  const cardId = `channel/${escapeHtml(org.org_id)}-${escapeHtml(ch.platform)}`;
  return `
    <div class="detail-panel" data-card-id="${cardId}">
      <button class="card-copy-ref" aria-label="Copy channel ref" data-for-card onclick="event.stopPropagation()">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        copy ref
      </button>
      <div class="detail-header">
        <span class="detail-platform">${escapeHtml(ch.platform)}</span>
        ${ch.name ? `<span class="detail-name">${escapeHtml(ch.name)}</span>` : ''}
        ${ch.handle ? `<span class="detail-handle">${escapeHtml(ch.handle)}</span>` : ''}
        <span class="channel-chip chip-${status}">${status}</span>
      </div>
      ${fields.length > 0 ? `<div class="detail-grid">${fields.map(f => `
        <div class="detail-field">
          <div class="field-label">${f.label}</div>
          <div class="field-value">${f.value}</div>
        </div>`).join('')}
      </div>` : '<div class="detail-empty">No details available. Edit presence.md to add channel info.</div>'}
    </div>`;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeChannelDetail();
});

function renderRecoveryChains(orgs) {
  const recoveryOrgs = orgs.filter(o =>
    o.channels.some(c => inferStatus(c) === 'recovery')
  );

  if (recoveryOrgs.length === 0) {
    document.getElementById('panel-3-recovery-chains').style.display = 'none';
    return;
  }

  document.getElementById('panel-3-recovery-chains').style.display = '';
  document.getElementById('recovery-count').textContent = recoveryOrgs.length;

  const cards = recoveryOrgs.map(org => {
    const blockedChannels = org.channels.filter(c => inferStatus(c) === 'recovery');
    return blockedChannels.map(ch => `
      <div class="recovery-card" data-card-id="recovery/${escapeHtml(org.org_id + '-' + ch.platform)}">
        <button class="card-copy-ref" aria-label="Copy recovery ref" data-for-card onclick="event.stopPropagation()">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          copy ref
        </button>
        <div class="recovery-title">${escapeHtml(org.org_name)} / ${escapeHtml(ch.platform)}</div>
        <div class="recovery-chain">
          ${ch.recovery_chain ? ch.recovery_chain.split('→').map((node, i, arr) =>
            `<span class="node ${i === 0 ? 'blocked-node' : ''}">${escapeHtml(node.trim())}</span>${i < arr.length - 1 ? '<span class="arrow">&rarr;</span>' : ''}`
          ).join('') : `<span class="node blocked-node">${escapeHtml(ch.handle || ch.name || ch.platform)}</span> <span style="color:var(--ink-4);font-size:11px">${escapeHtml(ch.blocker || 'recovery details in presence.md')}</span>`}
        </div>
        ${ch.blocker ? `<div style="margin-top:8px;font-size:12px;color:var(--gap);font-weight:500">Blocker: ${escapeHtml(ch.blocker)}</div>` : ''}
      </div>
    `).join('');
  }).join('');

  document.getElementById('recovery-content').innerHTML = cards;
  wireCopyRef(document.getElementById('recovery-content'));
}

async function refetchAndRender() {
  try {
    const results = await Promise.all(PRESENCE_SOURCES.map(fetchPresence));
    const orgs = results.filter(Boolean);
    _presenceOrgs = orgs;

    if (orgs.length === 0) {
      document.getElementById('panel-2-presence-matrix').innerHTML =
        '<div class="state">No presence data found. Create presence.md files in your Area folders.</div>';
      return;
    }

    const savedDetail = _activeDetail
      ? { orgId: _activeDetail.orgId, platform: _activeDetail.platform } : null;

    renderSummary(orgs);
    renderMatrix(orgs);
    renderRecoveryChains(orgs);

    if (savedDetail) {
      const dot = document.querySelector(`.status-dot[data-org-id="${savedDetail.orgId}"][data-platform="${savedDetail.platform}"]`);
      if (dot) openChannelDetail(savedDetail.orgId, savedDetail.platform, dot);
    }
  } catch (e) {
    document.getElementById('panel-2-presence-matrix').innerHTML =
      `<div class="state error">Error loading data: ${escapeHtml(e.message)}</div>`;
  }
}

LiveUpdates.subscribe(refetchAndRender);
LiveUpdates.mountStatusIndicator(document.querySelector('.masthead-toprow'));
refetchAndRender();
</script>
</body>
</html>
